[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

monitor_speed = 115200

; The nanoatmega328 board definition assumes the old 57600 bootloader, which
; this board does not have — avrdude just returns stk500_getsync() timeouts.
; 115200 syncs. Same effect as switching to nanoatmega328new, stated explicitly
; because the board is an FTDI unit that looks like it should want the old rate.
upload_speed = 115200

build_flags =
    -I include

lib_extra_dirs = ../share

lib_deps =
    mikem/RadioHead @ ^1.120
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.9.0
    teckel12/NewPing @ ^1.9.7
