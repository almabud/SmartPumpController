; pump-controller/platformio.ini
;
; Board: ESP32-S3-WROOM-1 N16R8 (16MB flash, 8MB octal PSRAM, dual Type-C)
; Comments in .ini files use ';' not '#'.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; --- N16R8 flash/PSRAM ---
; 16MB flash, 8MB OCTAL PSRAM (the "R8" in N16R8).
; board_build.partitions selects an OTA-capable layout (two app slots) since server
; OTA updates are a planned feature.
; board_build.flash_size = 16MB
; board_build.partitions = default_16MB.csv
; board_build.psram_type = opi
; board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I include

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    adafruit/Adafruit GFX Library @ ^1.12.0